name: Build Executa binaries

# Builds the self-contained PyInstaller binary for the bundled
# `invoice-sanity-check` Executa on every platform the Agent can run on,
# smoke-tests the stdio JSON-RPC protocol, packages each one as
# `<tool_id>-<platform>.tar.gz` (binary + archive-root manifest.json) and
# attaches them to the GitHub Release `invoice-sanity-check-v<version>`.
#
# The release assets are what `executas/invoice-sanity-check/executa.json`
# points at through `distribution.binary_urls`; on `anna-app apps cut`
# matrix-nexus mirrors them into Anna storage and pins sha256, so the Agent
# installs without needing Python/uv on the host.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Executa version to build & tag (e.g. 0.2.2)"
        required: true
        type: string
  push:
    tags:
      - "invoice-sanity-check-v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, platform: darwin-arm64, ext: "" }
          # macOS x86_64 builds on an Apple Silicon runner via Rosetta 2
          # (x64 Python) — the Intel `macos-13` runner is retired.
          - { os: macos-15, platform: darwin-x86_64, python_arch: x64, ext: "" }
          - { os: ubuntu-latest, platform: linux-x86_64, ext: "" }
          - { os: windows-latest, platform: windows-x86_64, ext: ".exe" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python_arch || '' }}

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build binary
        working-directory: executas/invoice-sanity-check
        env:
          TOOL_ID: tool-naomi197-invoice-sanity-check-qhj8bq39
          EXT: ${{ matrix.ext }}
        shell: bash
        run: |
          pyinstaller --onefile --clean --noupx --name "$TOOL_ID" invoice_sanity_check_plugin.py
          test -f "dist/$TOOL_ID$EXT"
          ls -l dist

      - name: Smoke test (describe + invoke)
        working-directory: executas/invoice-sanity-check
        env:
          TOOL_ID: tool-naomi197-invoice-sanity-check-qhj8bq39
          EXT: ${{ matrix.ext }}
        shell: bash
        run: |
          out="$(printf '%s\n' '{"jsonrpc":"2.0","method":"describe","id":1}' | "./dist/$TOOL_ID$EXT")"
          echo "describe → $out"
          printf '%s' "$out" | python3 -c "import sys,json; d=json.load(sys.stdin); assert 'check_invoice' in [t['name'] for t in d['result']['tools']]; print('describe ok')"
          inv="$(printf '%s\n' '{"jsonrpc":"2.0","method":"invoke","id":2,"params":{"tool":"check_invoice","arguments":{"invoice_number":"INV-1","items":[{"quantity":2.5,"unit_price":100,"amount":250}],"subtotal":250,"tax":25,"total":275}}}' | "./dist/$TOOL_ID$EXT")"
          echo "invoke → $inv"
          printf '%s' "$inv" | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['result']['success'] and d['result']['data']['valid']; print('invoke ok')"

      - name: Package (tar.gz + sha256)
        working-directory: executas/invoice-sanity-check/dist
        env:
          TOOL_ID: tool-naomi197-invoice-sanity-check-qhj8bq39
          PLATFORM: ${{ matrix.platform }}
          EXT: ${{ matrix.ext }}
        shell: bash
        run: |
          printf '{"name":"%s","runtime":{"binary":{"entrypoint":"%s%s"}}}\n' "$TOOL_ID" "$TOOL_ID" "$EXT" > manifest.json
          asset="$TOOL_ID-$PLATFORM.tar.gz"
          tar czf "$asset" "$TOOL_ID$EXT" manifest.json
          sha256sum "$asset" > "$asset.sha256" 2>/dev/null || shasum -a 256 "$asset" > "$asset.sha256"
          cat "$asset.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: executa-${{ matrix.platform }}
          path: |
            executas/invoice-sanity-check/dist/*.tar.gz
            executas/invoice-sanity-check/dist/*.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Resolve tag
        id: tag
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            echo "tag=invoice-sanity-check-v$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish Release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: invoice-sanity-check ${{ steps.tag.outputs.tag }}
          body: "Self-contained Executa binaries for `tool-naomi197-invoice-sanity-check-qhj8bq39`."
          files: artifacts/*
